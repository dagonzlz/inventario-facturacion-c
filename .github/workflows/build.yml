name: Compilar y probar
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: sudo apt-get update && sudo apt-get install -y build-essential sqlite3 libsqlite3-dev python3
      - name: Compilar y ejecutar pruebas de integración
        run: make test
